<bw-auth-layout>
  <div class="form-header">
    <h2>Bienvenido</h2>
    <p>Ingresa a tu cuenta para continuar</p>
  </div>

  <form class="auth-form" (ngSubmit)="onLogin()" #loginForm="ngForm">
    <div class="field">
      <label for="email">Email</label>
      <input
        pInputText
        id="email"
        name="email"
        type="email"
        placeholder="tu@email.com"
        [(ngModel)]="credentials.email"
        required
        class="w-full" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <p-password
        inputId="password"
        name="password"
        placeholder="••••••••"
        [(ngModel)]="credentials.password"
        [feedback]="false"
        [toggleMask]="true"
        required />
    </div>

    @if (error()) {
      <p-message severity="error" class="w-full">{{ error() }}</p-message>
    }

    <p-button
      type="submit"
      label="Iniciar sesión"
      icon="pi pi-sign-in"
      class="w-full submit-btn"
      [loading]="loading()"
      [disabled]="!credentials.email || !credentials.password" />
  </form>

  <div class="forgot-password">
    <a routerLink="/forgot-password">{{ lang.t('auth.login.forgot') }}</a>
  </div>

  <div class="auth-footer">
    <span>¿No tienes cuenta?</span>
    <a routerLink="/register">Registrarse</a>
  </div>
</bw-auth-layout>
